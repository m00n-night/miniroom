<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>미니룸</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
    <style>
      /*
       * 미니룸 — 아이소메트릭 도트 방 꾸미기
       * 화면: 336×254 픽셀 방을 정수에 가까운 배율로 확대, 픽셀마다 조명 계산
       * 색과 글꼴: 복숭아 바탕, 코코아 잉크, 토마토 강조 / Jua 제목·버튼 + Gowun Dodum 본문
       * 배치: 방이 주인공, 오른쪽에 가구 상자 (좁은 화면에서는 방 → 조작 → 가구 상자)
       */
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f6dcc8, #1d1513);
        --ink: light-dark(#2b1b17, #f6e6da);
        --panel: light-dark(#fff4ea, #2a1f1c);
        --line: light-dark(#2b1b17, #0c0807);
        --soft: light-dark(#efc8ae, #3b2c28);
        --pick: light-dark(#ffd9a8, #6a4630);
        --acc: #ff5a3c;
        --mute: light-dark(#6d5148, #c8b0a4);
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        min-width: 0;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.55 "Gowun Dodum",
          system-ui,
          sans-serif;
        overflow-x: clip;
      }
      h1,
      h2,
      button,
      output,
      .lab,
      .bar b {
        font-family: Jua, "Gowun Dodum", sans-serif;
        font-weight: 400;
      }
      .top {
        max-width: 1480px;
        margin: auto;
        padding: clamp(20px, 3vw, 36px) max(4vw, 16px) 8px;
      }
      h1 {
        font-size: clamp(32px, 5vw, 46px);
        line-height: 1.05;
        margin: 0 0 6px;
        text-wrap: balance;
      }
      .top p {
        margin: 0;
        color: var(--mute);
      }
      .game {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 340px);
        gap: clamp(16px, 2.4vw, 32px);
        max-width: 1480px;
        margin: auto;
        padding: 16px max(4vw, 16px) 48px;
        align-items: start;
      }
      .stage {
        width: 100%;
        min-width: 0;
      }
      .frame {
        background: radial-gradient(120% 90% at 50% 30%, #4a3028, #1a110f);
        padding: 10px;
        border-radius: 12px;
        box-shadow:
          inset 0 0 0 3px #120a08,
          0 6px 0 var(--line);
      }
      #room {
        display: block;
        margin: 0 auto;
        width: 336px;
        height: 254px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        cursor: pointer;
        outline: none;
        border-radius: 4px;
      }
      #room:focus-visible {
        box-shadow: 0 0 0 3px var(--acc);
      }
      .bar {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 62px;
        margin-top: 16px;
        padding: 8px 10px;
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: 8px;
        justify-content: center;
      }
      .r1 {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .bar b {
        font-size: 19px;
      }
      .sp {
        flex: 1 1 auto;
      }
      .cols {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .cols span {
        font-size: 14px;
        color: var(--mute);
        margin-right: 2px;
      }
      .cols button {
        width: 36px;
        height: 36px;
        min-height: 36px;
        padding: 0;
        border-radius: 5px;
        box-shadow: 0 2px 0 var(--line);
      }
      .cols button[aria-pressed="true"] {
        outline: 3px solid var(--acc);
        outline-offset: 1px;
      }
      .cols .pat {
        width: auto;
        padding: 0 10px 0 6px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        min-height: 36px;
      }
      .cols .pat i {
        width: 18px;
        height: 18px;
        border: 2px solid var(--line);
        border-radius: 3px;
      }
      .sz button {
        width: 36px;
        height: 36px;
        min-height: 36px;
        font-size: 20px;
        line-height: 1;
      }
      .sz b {
        font-size: 16px;
        min-width: 3.4em;
        text-align: center;
      }
      .sz .gap {
        width: 10px;
      }
      .seg button {
        width: auto;
        padding: 0 12px;
        font-size: 14px;
        min-height: 36px;
      }
      .seg small {
        color: var(--mute);
        font-size: 13px;
        margin-left: 4px;
      }
      .parts button {
        width: auto;
        padding: 0 10px 0 6px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        min-height: 36px;
      }
      .parts i {
        width: 22px;
        height: 16px;
        border: 2px solid var(--line);
        border-radius: 3px;
      }
      .cols .reset {
        width: auto;
        padding: 0 10px;
        font-size: 14px;
      }
      .hint {
        color: var(--mute);
        font-size: 15px;
      }
      .msg {
        min-height: 22px;
        margin: 6px 2px 0;
        font-size: 14px;
        color: var(--mute);
      }
      button {
        font-size: 16px;
        color: var(--ink);
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: 6px;
        padding: 8px 12px;
        min-height: 44px;
        cursor: pointer;
        box-shadow: 0 3px 0 var(--line);
        transition: transform 0.06s;
      }
      button:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 var(--line);
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--acc);
        outline-offset: 2px;
      }
      button.hot {
        background: var(--acc);
        color: #fff;
      }
      .time {
        display: grid;
        grid-template-columns: auto auto minmax(0, 1fr) minmax(120px, 170px);
        gap: 10px 16px;
        align-items: center;
        margin-top: 12px;
      }
      .time output {
        font-size: 22px;
        white-space: nowrap;
        min-width: 5.5em;
      }
      #now {
        font-size: 14px;
        padding: 6px 10px;
        min-height: 40px;
      }
      #now[aria-pressed="true"] {
        background: var(--ink);
        color: var(--panel);
      }
      input[type="range"] {
        width: 100%;
        height: 44px;
        accent-color: var(--acc);
        margin: 0;
      }
      .meter .lab {
        display: flex;
        justify-content: space-between;
        font-size: 15px;
      }
      .meter i {
        display: block;
        height: 14px;
        border: 2px solid var(--line);
        background: var(--soft);
        margin-top: 2px;
      }
      .meter em {
        display: block;
        height: 100%;
        width: 0;
        background: #ffcf6b;
        transition: width 0.2s;
      }
      .panel {
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: 10px;
        padding: 14px;
        box-shadow: 0 5px 0 var(--line);
      }
      .tabs {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 5px;
      }
      .tabs button {
        padding: 6px 2px;
        font-size: 14px;
        line-height: 1.15;
        word-break: keep-all;
      }
      .tabs button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--panel);
      }
      .items {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 7px;
        margin-top: 12px;
      }
      .it {
        display: grid;
        grid-template-rows: 52px auto;
        place-items: center;
        gap: 2px;
        padding: 6px 2px 5px;
        font-size: 14px;
        line-height: 1.2;
        position: relative;
      }
      .it canvas {
        image-rendering: pixelated;
      }
      .it[aria-pressed="true"] {
        background: var(--pick);
        box-shadow:
          0 0 0 3px var(--acc),
          0 3px 0 var(--line);
      }
      .it .glow {
        position: absolute;
        top: 4px;
        right: 5px;
        width: 8px;
        height: 8px;
        background: #ffcf6b;
        box-shadow: 0 0 0 2px var(--line);
      }
      h2 {
        font-size: 18px;
        margin: 18px 0 8px;
      }
      .sw {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 6px;
      }
      .sw button {
        padding: 0;
        height: 44px;
        min-height: 44px;
        border-radius: 6px;
        overflow: hidden;
      }
      .sw canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .sc {
        margin-top: 8px;
        gap: 5px;
      }
      .sc button {
        width: 28px;
        height: 28px;
        min-height: 28px;
      }
      .sc .reset {
        min-height: 28px;
        height: 28px;
      }
      .sw button[aria-pressed="true"] {
        box-shadow:
          0 0 0 3px var(--acc),
          0 3px 0 var(--line);
      }
      .presets {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .presets button {
        display: grid;
        text-align: left;
        gap: 1px;
        padding: 8px 10px;
        line-height: 1.25;
      }
      .presets b {
        font-family: Jua, sans-serif;
        font-weight: 400;
        font-size: 16px;
      }
      .presets small {
        font-family: "Gowun Dodum", sans-serif;
        font-size: 13px;
        color: var(--mute);
      }
      .acts {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-top: 18px;
      }
      .acts button {
        font-size: 15px;
        padding: 8px 6px;
      }
      .note {
        font-size: 13px;
        color: var(--mute);
        margin: 14px 0 0;
      }
      .keys {
        font-size: 13px;
        color: var(--mute);
        margin: 10px 2px 0;
      }
      @media (max-width: 860px) {
        .game {
          grid-template-columns: minmax(0, 1fr);
        }
        .panel {
          width: 100%;
        }
      }
      @media (max-width: 600px) {
        .time {
          grid-template-columns: auto auto;
        }
        .time input {
          grid-column: 1/-1;
        }
        .meter {
          grid-column: 1/-1;
        }
        .keys {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        button,
        .meter em {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <h1>미니룸</h1>
      <p>가구를 골라 방에 놓고, 색을 바꾸고, 시간을 돌려 불을 켜 보세요.</p>
    </header>
    <main class="game">
      <section class="stage">
        <div class="frame">
          <canvas id="room" width="336" height="254" tabindex="0" aria-label="꾸미는 방. 물건을 누르면 선택, 끌면 이동합니다."></canvas>
        </div>
        <div class="bar" id="selbar"></div>
        <div class="msg" id="msg" aria-live="polite"></div>
        <div class="time">
          <output id="hl" for="hour">저녁 8:00</output>
          <button id="now" type="button">지금 시간</button>
          <input type="range" id="hour" min="0" max="23.5" step="0.5" aria-label="시간" />
          <div class="meter">
            <div class="lab">
              <span>방 밝기</span>
              <span id="bv">0%</span>
            </div>
            <i><em id="bm"></em></i>
          </div>
        </div>
        <p class="keys">
          단축키: 오른쪽 클릭·Esc 그만 놓기/선택 해제 · Shift+클릭 여러 개 놓기 · R 돌리기 · 화살표 이동 · L 불 · Delete 치우기 · Ctrl+Z
          되돌리기
        </p>
      </section>
      <aside class="panel" aria-label="가구 상자">
        <div class="tabs" id="tabs"></div>
        <div class="items" id="items"></div>
        <h2>예시 방</h2>
        <div class="presets" id="presets"></div>
        <h2>벽지</h2>
        <div class="sw" id="wsw"></div>
        <div class="cols sc" id="wcol"></div>
        <h2>바닥</h2>
        <div class="sw" id="fsw"></div>
        <div class="cols sc" id="fcol"></div>
        <div class="acts">
          <button id="undo">되돌리기</button>
          <button id="alllight">불 모두 끄기</button>
          <button id="clear">방 비우기</button>
        </div>
        <p class="note">예시 방을 누르면 지금 방 대신 그 방이 열려요. 꾸민 방은 이 브라우저에 저장돼요.</p>
      </aside>
    </main>
    <script>
      {
        // ── 기본 상수 · 색 도우미 ──
        const T = 16,
          N = 10,
          G = 8,
          NG = 20,
          VR = 4,
          WH = 72,
          W = 336,
          H = 254,
          OX = 168,
          OY = 86;
        const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const $ = (id) => document.getElementById(id);
        const cv = $("room"),
          ctx = cv.getContext("2d"),
          IMG = ctx.createImageData(W, H);
        const HC = new Map();
        const hex = (h) => {
          let v = HC.get(h);
          if (!v) {
            const n = parseInt(h.slice(1), 16);
            v = [(n >> 16) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
            HC.set(h, v);
          }
          return v;
        };
        const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
        const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
        const K = {
          knob: hex("#3a2418"),
          back: hex("#2a1810"),
          bk: ["#c94f5d", "#4f7cc4", "#e8c070", "#5fae7c", "#9a6fc4", "#e86a8a", "#7aa0e0"].map(hex),
          grey: hex("#9a9a9a"),
          black: hex("#1a1a1a"),
          white: hex("#ffffff"),
          moon: hex("#fff6c8"),
          gold: hex("#e8c070"),
          sun: hex("#ffcf6b"),
          red: hex("#ff6b6b"),
          peach: hex("#ff9a6b"),
          green: hex("#5fae7c"),
          ink: hex("#2b1b17"),
          tick: hex("#c94f5d"),
          sand: hex("#e8c070"),
          orange: hex("#ff8a3a"),
          yellow: hex("#ffe28a"),
          fo: hex("#ffb040"),
          fr: hex("#ff6a2a"),
          nb: hex("#2a1d1a"),
          acc: hex("#ff5a3c"),
          bad: hex("#ff2a2a"),
          ok: hex("#5fd36a"),
          trim: hex("#5a3520"),
          warm: hex("#ffd98a"),
        };
        let SKY = { c: hex("#8fd0ff"), night: false },
          hour = 20,
          TIME = 0;
        const WD = "#8a5530",
          WOOD = "#c98d55",
          GOLD = "#d9a840";
        const B = (x, y, z, w, d, h, c, o) => ({ x, y, z, w, d, h, c, e: (o && o.e) || 0, t: (o && o.t) || null });

        // ── 표면 텍스처 ──
        const seg = (px, pz, ex, ez) => {
          const t = Math.max(0, Math.min(1, (px * ex + pz * ez) / (ex * ex + ez * ez)));
          return Math.hypot(px - t * ex, pz - t * ez) < 0.75;
        };
        const HEART = [".##...##.", "#..#.#..#", "#...#...#", ".#.....#.", "..#...#..", "...#.#...", "....#...."];
        const TX = {
          drawers: (x, y, z, f, b) =>
            f !== "F" ? b.c : (z | 0) % 7 === 0 ? mul(b.c, 0.6) : Math.abs(x - b.w / 2) < 1.5 && (z | 0) % 7 === 4 ? K.knob : b.c,
          doors: (x, y, z, f, b) => {
            if (f !== "F") return b.c;
            const dx = Math.abs(x - b.w / 2);
            return dx < 0.8 ? mul(b.c, 0.6) : dx > 1.4 && dx < 2.6 && Math.abs(z - b.h * 0.55) < 2 ? K.knob : z < 2 ? mul(b.c, 0.75) : b.c;
          },
          books: (x, y, z, f, b) => {
            if (f !== "F") return b.c;
            const sh = Math.floor(z / 13),
              zz = z - sh * 13;
            if (x < 1.5 || x > b.w - 1.5 || zz < 2 || z > b.h - 2) return b.c;
            const i = Math.floor((x - 1.5) / 2.6),
              hh = 6 + ((i * 7 + sh * 3) % 4);
            return zz - 2 > hh ? K.back : K.bk[(i + sh * 3) % 7];
          },
          bricks: (x, y, z, f, b) => {
            if (f === "T") return b.c;
            const s = f === "F" ? x : y,
              r = Math.floor(z / 5);
            return z % 5 < 1 || (s + (r % 2) * 4) % 8 < 1 ? mul(b.c, 0.75) : b.c;
          },
          keys: (x, y, z, f, b) => {
            if (f !== "T") return b.c;
            const k = Math.floor(x / 3);
            if (x % 3 < 0.8) return K.grey;
            return y < 2.6 && [0, 1, 3, 4, 5].includes(k % 7) && x % 3 > 1.8 ? K.black : b.c;
          },
          sky: (x, y, z, f, b) => {
            if (f !== "F") return b.c;
            const xi = Math.floor(x),
              zi = Math.floor(z),
              H = b.h,
              u = xi + Math.floor(b.sw ? b.y0 : b.x0),
              t = RM ? 0 : TIME / 1000;
            if (SKY.night) {
              const c = mul(SKY.c, 1 - (z / H) * 0.35);
              // 별똥별: 창마다 시간을 어긋나게 해서 여기저기서 떨어지게
              const seed = Math.floor(b.x0 + b.y0);
              {
                // 위에서 아래로 비스듬히 떨어지는 가는 별똥별 (머리 + 긴 꼬리)
                const per = 19 + (seed % 7),
                  dur = 2.4,
                  ph = (t + seed * 1.37) % per;
                if (ph < dur) {
                  const p = ph / dur,
                    sx = b.w * (0.45 + (((seed * 7) % 5) * 0.1)),
                    hx = sx - p * (H + 10) * 0.42,
                    hz = H + 4 - p * (H + 10),
                    dx = x - hx,
                    dz = z - hz,
                    along = dx * 0.387 + dz * 0.922,
                    across = Math.abs(-dx * 0.922 + dz * 0.387),
                    len = 16;
                  if (along > -0.6 && along < 1 && across < 0.8) return K.white;
                  if (along >= 1 && along < len && across < 0.42) return lerp(lerp(K.white, hex("#bcd4ff"), along / len), c, Math.pow(along / len, 0.8));
                }
              }
              // 반짝이는 별
              const hs = (u * 73 + zi * 151) % 97;
              if (hs === 0 || hs === 41 || hs === 77) return Math.sin(t * 2.6 + hs + u) > -0.2 ? K.white : lerp(c, K.white, 0.35);
              if (x > b.w - 9 && x < b.w - 4 && z > H - 9 && z < H - 4 && !(x > b.w - 7 && z > H - 8)) return K.moon;
              return c;
            }
            const c = lerp(SKY.c, K.white, Math.max(0, (H * 0.55 - z) / H) * 0.35),
              dusk = sunAt(hour) < 0.35;
            // 날아가는 새 떼 (45초마다 한 번)
            const bt = t % 45,
              bx = -24 + bt * 12,
              bz = 18 + Math.sin(t * 1.5) * 2,
              flap = Math.floor(t * 6) % 2;
            for (const [ox, oz] of [[0, 0], [-6, -2], [-11, 1]]) {
              const ddx = u - Math.round(bx + ox),
                ddz = zi - Math.round(bz + oz),
                ax = Math.abs(ddx);
              if ((ax === 0 && ddz === 0) || (ax === 1 && ddz === (flap ? 1 : 0)) || (ax === 2 && ddz === (flap ? 1 : -1)))
                return hex("#3a3a44");
            }
            // 흘러가는 구름
            const cu = (((u + t * 3) % 96) + 96) % 96;
            for (const [a, cz, r] of [[12, 20, 4.5], [18, 21, 6], [24, 20, 4], [60, 11, 3.5], [65, 12, 4.5], [70, 11, 3]]) {
              if (Math.hypot(cu - a, (z - cz) * 1.4) < r) {
                const cc = dusk ? lerp(K.white, hex("#ffb8a0"), 0.55) : K.white;
                return z < cz - r * 0.35 ? mul(cc, 0.9) : cc;
              }
            }

              z: 0,

            };
          const osA = St.items.filter((o) => !ign.has(o.id) && ITEMS[o.k].L === "f" && ov(F, fp4(o))),
            onWin = (o) =>
              [...anc(o)].some((h) => {
                const q = byId(h);

            os = osA.filter((o) => !onWin(o)),
            sk = osA.filter(onWin),
            under = (z) => sk.every((q) => z + HT(it.k) <= (q.z || 0));
          for (const o of St.items) {
            const E = ITEMS[o.k];
            if (!E.win || ign.has(o.id) || (o.sill != null && o.sill !== 2)) continue;
            const w = (o.rw || E.w) * 2,
              R = o.side === "L" ? { x0: 0, x1: 2, y0: o.gx * 2, y1: o.gx * 2 + w } : { x0: o.gx * 2, x1: o.gx * 2 + w, y0: 0, y1: 2 };
            if (!inside(F, R)) continue;

            if (!(wz != null ? Math.abs(sz - wz) < 10 : it.host === o.id)) continue;
            if (osA.some((q) => q.host === o.id || anc(q).has(o.id) || (q.z || 0) + HT(q.k) > sz)) return { ok: false };
            return { ok: true, z: sz, host: o.id };

          if (!best) return { ok: false };
          const A = anc(best);

        }
        const canPlace = (it, ign) => fit(it, ignSet(ign)).ok;

        const planeHit = (p, z) => {
          const a = p.x - OX,

        const wallHit = (p) => {
          const a = p.x - OX,

            u: Math.floor(Math.min(N * T - 1, Math.max(0, al)) / T),

              k,
              side: "R",

        }
        function hlOf(it, ok, host) {
          const D = ITEMS[it.k],
            f = fpOf(D, it);
          if (D.L === "w")
            return {
              t: it.side === "L" ? -2 : -3,

          return { t: host || -1, n: 1, x0: it.gx * G, x1: (it.gx + f.w) * G, y0: it.gy * G, y1: (it.gy + f.h) * G, ok };
        }
        const PK = { pos: new Float32Array(W * H * 3), id: new Int32Array(W * H), nrm: new Uint8Array(W * H) };
        function pickTile(p) {
          const px = Math.floor(p.x),
            py = Math.floor(p.y);
          if (px >= 0 && py >= 0 && px < W && py < H) {
            const i = py * W + px,
              id = PK.id[i];
            if (PK.nrm[i] === 1) {
              const o = id > 0 ? byId(id) : null;
              if (id === -1 || (o && (ITEMS[o.k].top != null || ITEMS[o.k].win)))
                return { tx: Math.floor(PK.pos[i * 3] / G), ty: Math.floor(PK.pos[i * 3 + 1] / G), z: PK.pos[i * 3 + 2] };
            }
          }
          const q = planeHit(p, 0);
          return { tx: Math.floor(q.x / G), ty: Math.floor(q.y / G), z: 0 };
        }

        // ── 반려동물 움직임 ──
        const S = surf(W, H, OX, OY);
        const DIRS = [
          [1, 0],
          [-1, 0],
          [0, 1],
          [0, -1],
        ];
        function petStep(dt) {
          for (const it of St.items) {
            const D = ITEMS[it.k];
            if (!D.pet) continue;
            let s = PS.get(it.id);
            const iz = it.z || 0;
            if (
              !s ||
              (!s.mv && (Math.round(s.x) !== it.gx * G || Math.round(s.y) !== it.gy * G || Math.round(s.z) !== iz)) ||
              (s.mv && (s.tx !== it.gx || s.ty !== it.gy))
            ) {
              s = {
                x: it.gx * G,
                y: it.gy * G,
                z: iz,
                tx: it.gx,
                ty: it.gy,
                mv: false,
                wait: 0.5 + Math.random() * 2,
                ph: 0,
                last: -1,

              };

            }
            if ((drag && drag.it === it) || !it.on) {
              s.x = it.gx * G;
              s.y = it.gy * G;
              s.z = iz;
              s.mv = false;
              continue;
            }
            if (s.mv) {
              const ex = it.gx * G,
                ey = it.gy * G,
                dx = ex - s.x,
                dy = ey - s.y,
                dz = iz - s.z,
                dl = Math.hypot(dx, dy, dz),
                sp = (D.pet === "dog" ? 26 : D.pet === "rabbit" ? 22 : 19) * dt * (s.jump ? 1.6 : 1);
              s.ph += dt * (s.jump ? 6 : 11);
              if (dl <= sp) {
                s.x = ex;
                s.y = ey;
                s.z = iz;
                s.mv = false;
                s.jump = false;
                s.wait = s.climb ? 10 + Math.random() * 14 : Math.random() < 0.2 ? 1.5 + Math.random() * 3.5 : Math.random() * 0.35;

            if (s.last >= 0 && Math.random() < 0.55) opts.unshift(s.last);

              const [dx, dy] = DIRS[i],
                c = { k: it.k, gx: it.gx + dx, gy: it.gy + dy, rot: 0, side: "R" },

        function skyAt(h) {
          const d = sunAt(h);
          return {
            c: d < 0.3 ? lerp(hex("#141a40"), hex("#f39a6b"), d / 0.3) : lerp(hex("#f39a6b"), hex("#8fd0ff"), Math.min(1, (d - 0.3) / 0.5)),

        let lastB = -1;

        // ── 그리기와 조명 ──
        function render() {

          const mov = drag ? ignSet(drag.it.id) : new Set(),
            boxes = [],
            late = [];

            for (let px = 0; px < W; px++) {

                    r = k[0];
                    g = k[1];
                    bl = k[2];

                    r *= 0.35;
                    g *= 0.35;
                    bl *= 0.35;

                } else if (id === -5) {
                  const k = ghost.ok ? K.ok : K.bad;
                  r = r * 0.6 + k[0] * 0.4;
                  g = g * 0.6 + k[1] * 0.4;
                  bl = bl * 0.6 + k[2] * 0.4;

              if (HL && id === HL.t && n === HL.n) {
                const inR =
                  HL.t === -1
                    ? X >= HL.x0 && X < HL.x1 && Y >= HL.y0 && Y < HL.y1

                  g = g * 0.55 + k[1] * 0.45;
                  bl = bl * 0.55 + k[2] * 0.45;

          if (bv !== lastB) {
            lastB = bv;
            $("bv").textContent = bv + "%";
            $("bm").style.width = bv + "%";
          }
        }

        let lastT = 0;

        // ── 애니메이션 루프 ──
        function loop(t) {
          const dt = Math.min(0.1, lastT ? (t - lastT) / 1000 : 0);
          lastT = t;
          TIME = t;
          petStep(dt);
          const skyAnim = !RM && St.items.some((i) => ITEMS[i.k].win),
            walk = St.items.some((i) => i.on && ITEMS[i.k].pet),
            fl = !RM && St.items.some((i) => i.on && ITEMS[i.k].fl);
          if (dirty || (walk && t - (loop.l || 0) > 66) || (fl && t - (loop.l || 0) > 110) || (skyAnim && t - (loop.l || 0) > 90)) {
            render();
            dirty = 0;
            loop.l = t;
          }
          requestAnimationFrame(loop);
        }

        // ── 마우스·터치 입력 ──
        const eul = (n) => {
          const c = n.charCodeAt(n.length - 1) - 44032;
          return n + (c >= 0 && c < 11172 && c % 28 ? "을" : "를");
        };
        const msg = (m) => {
          $("msg").textContent = m;

              g.className = "glow";
              g.title = "빛이 나요";
              b.appendChild(g);
            }
            b.onclick = () => {
              tool = tool === k ? null : k;
              toolRot = 0;
              sel = null;
              msg(tool ? `방을 눌러 ${eul(D.n)} 놓으세요. ${D.L === "w" ? "벽에 붙어요. " : ""}초록색이면 놓을 수 있어요.` : "");
              ui();
            };
            box.appendChild(b);
          }
        }
        function pv(P, c, wall) {
          const cv = document.createElement("canvas");
          cv.width = 32;
          cv.height = 24;
          const x = cv.getContext("2d"),
            im = x.createImageData(32, 24),
            [a, b] = pairOf(P, c);
          for (let py = 0; py < 24; py++)
            for (let px = 0; px < 32; px++) {
              const col = wall ? P.f(px, 31 - py, a, b) : P.f(px + 3, py + 3, a, b),
                o = (py * 32 + px) * 4;
              im.data[o] = col[0] * 255;
              im.data[o + 1] = col[1] * 255;
              im.data[o + 2] = col[2] * 255;
              im.data[o + 3] = 255;
            }
          x.putImageData(im, 0, 0);
          return cv;
        }
        function swatches() {
          const mk = (el, arr, key, ck, cols, colEl) => {
            el.innerHTML = "";
            arr.forEach((t, i) => {
              const b = document.createElement("button");
              b.setAttribute("aria-label", t.n);
              b.title = t.n;
              b.appendChild(pv(t, i === St[key] ? St[ck] : null, key === "wall"));
              b.setAttribute("aria-pressed", i === St[key]);
              b.onclick = () => {
                snap();
                St[key] = i;
                St[ck] = null;
                save();
                swatches();
                ui();
              };
              el.appendChild(b);
            });
            const cur = St[ck] || "";
            colEl.innerHTML =
              "<span>색</span>" +
              cols
                .map((c) => `<button data-c="${c}" style="background:${c}" aria-label="색 ${c}" aria-pressed="${cur === c}"></button>`)
                .join("") +
              `<button class="reset" data-c="" aria-pressed="${!cur}">기본</button>`;
            colEl.onclick = (e) => {
              const b = e.target.closest("button");
              if (!b) return;
              snap();
              St[ck] = b.dataset.c || null;
              save();
              swatches();
              ui();
            };
          };
          mk($("wsw"), WALLS, "wall", "wallC", WCOLS, $("wcol"));
          mk($("fsw"), FLOORS, "floor", "floorC", FCOLS, $("fcol"));
        }

        $("hour").value = hour;
        $("hour").addEventListener("input", (e) => {
          hour = +e.target.value;
          live = false;
          ui();
          save();
        });
        $("now").onclick = () => {
          live = true;
          hour = nowHour();
          $("hour").value = hour;
          ui();
          save();
        };
        setInterval(() => {
          if (!live) return;
          const h = nowHour();
          if (Math.abs(h - hour) > 0.001) {
            hour = h;
            $("hour").value = hour;
            ui();
          }
        }, 20000);
        $("undo").onclick = doUndo;
        $("alllight").onclick = () => {
          const L = St.items.filter((i) => ["불", "TV", "전원"].includes(ITEMS[i.k].tog));
          if (!L.length) {
            msg("켤 조명이 아직 없어요. 조명 칸에서 골라 보세요.");
            return;
          }
          snap();
          const v = !L.some((i) => i.on);
          L.forEach((i) => (i.on = v));
          save();
          ui();
        };
        $("clear").onclick = () => {
          snap();
          St.items = [];
          sel = null;
          tool = null;
          save();
          msg("방을 비웠어요. 되돌리기로 다시 채울 수 있어요.");
          ui();
        };
        $("presets").innerHTML = PRESETS.map((p, i) => `<button data-i="${i}"><b>${p.n}</b><small>${p.d}</small></button>`).join("");
        $("presets").onclick = (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          const p = PRESETS[+b.dataset.i];
          snap();
          St = build(p);
          live = false;
          hour = p.hour;
          $("hour").value = hour;
          sel = null;
          tool = null;
          PS.clear();
          save();
          swatches();
          msg(`'${p.n}' 방을 불러왔어요. 시간은 예시 방에 맞춰 바뀌었어요. '지금 시간'을 누르면 실제 시간으로 돌아가요.`);
          ui();
        };
        document.addEventListener("keydown", (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
            e.preventDefault();
            doUndo();
            return;
          }
          if (e.target.tagName === "INPUT") return;
          if (e.key === "Escape") {
            tool = null;
            sel = null;
            msg("");
            ui();
            return;
          }
          if (tool && "rRㄱ".includes(e.key)) {
            toolRot = (toolRot + 1) % 4;
            dirty = 1;
            return;
          }
          const it = sel && byId(sel);
          if (!it) return;
          const D = ITEMS[it.k];
          if (e.key === "Delete" || e.key === "Backspace") {
            e.preventDefault();
            act("del");
          } else if ("rRㄱ".includes(e.key)) act("rot");
          else if ("lLㅣ".includes(e.key) && D.tog) act("tog");
          else if (document.activeElement === cv && e.key.startsWith("Arrow")) {
            e.preventDefault();
            const dx = { ArrowLeft: -1, ArrowRight: 1 }[e.key] || 0,
              dy = { ArrowUp: -1, ArrowDown: 1 }[e.key] || 0,
              t = { ...it, gx: it.gx + dx, gy: it.gy + (D.L === "w" ? -dy : dy) };
            if (canPlace(t, it.id)) {
              snap();
              moveGroup(it, t.gx - it.gx, t.gy - it.gy);
              save();
              dirty = 1;
            }
          }
        });

        // ── 화면 크기 맞추기 · 시작 ──
        const fr = document.querySelector(".frame");
        let lastK = 0,
          lastD = 0;
        function fitCanvas() {
          const cs = getComputedStyle(fr),
            avail = fr.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight),
            dpr = window.devicePixelRatio || 1,
            maxH = Math.max(260, innerHeight * 0.8);
          let k = Math.min((avail * dpr) / W, (maxH * dpr) / H);
          const fk = Math.floor(k);
          if (fk >= 1 && fk / k > 0.88) k = fk;
          k = Math.max(0.5, k);
          if (Math.abs(k - lastK) < 0.001 && dpr === lastD) return;
          lastK = k;
          lastD = dpr;
          cv.style.width = (W * k) / dpr + "px";
          cv.style.height = (H * k) / dpr + "px";
        }
        new ResizeObserver(fitCanvas).observe(fr);
        addEventListener("resize", fitCanvas);
        fitCanvas();
        tabs();
        items();
        swatches();
        ui();
        requestAnimationFrame(loop);
      }
    </script>
  </body>
</html>
